<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос для Лейлы</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main class="page">
        <section class="card" aria-live="polite">
            <p class="eyebrow">Есть важный вопрос</p>
            <h1 class="title" id="question">Лейла, я тебе нравлюсь? 😏</h1>

            <div class="button-stage" id="buttonStage">
                <button class="button button--yes" id="btnYes" type="button">Да</button>
                <button
                    class="button button--no"
                    id="btnNo"
                    type="button"
                    aria-label="Кнопка Нет, которая убегает"
                >
                    Нет
                </button>
            </div>

            <p class="hint" id="interactionHint">Попробуй нажать или навести курсор 😄</p>
        </section>
    </main>

    <script src="scripts/utils.js" defer></script>
    <script src="scripts/dom.js" defer></script>
    <script src="scripts/desktop.js" defer></script>
    <script src="scripts/mobile.js" defer></script>
    <script src="scripts/app.js" defer></script>
</body>
</html>
